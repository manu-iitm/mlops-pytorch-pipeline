apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
    project: mlops-pytorch-pipeline
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: model-serving

  template:
    metadata:
      labels:
        app: model-serving
        project: mlops-pytorch-pipeline

    spec:
      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: MODEL_PATH
              value: /app/checkpoints/classifier_v1.pt

          volumeMounts:
            - name: checkpoints-volume
              mountPath: /app/checkpoints
              readOnly: true

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

      volumes:                
        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: checkpoints-pvc
